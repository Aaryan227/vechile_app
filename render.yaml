services:
  - type: web
    name: vehicle-logistics-app
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vehicle-logistics-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MASTER_ACCESS_CODE
        value: MASTER_ACCESS_2026
      - key: ADMIN_ACCESS_CODE
        value: ADMIN_ACCESS_2026
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: vehicle-logistics-db
    databaseName: vehicle_logistics
    user: vehicle_user
    plan: free
